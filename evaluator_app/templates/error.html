<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - AI Evaluator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-shell">
        {% set user = session.get('user', 'Guest') %}
        {% include '_navbar.html' %}

        <main class="narrow-container">
            <section class="dashboard-card text-center" aria-labelledby="errorTitle">
                <div class="empty-icon" aria-hidden="true">!</div>
                <span class="eyebrow">Action needed</span>
                <h1 class="page-title mt-3" id="errorTitle">Something went wrong</h1>
                <div class="alert-custom error visible mt-4" role="alert">⚠️ {{ error }}</div>
                <div class="button-row justify-content-center mt-4">
                    <a href="/dashboard" class="btn-primary-custom">Back to Dashboard</a>
                </div>
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/ui.js') }}"></script>
</body>
</html>
