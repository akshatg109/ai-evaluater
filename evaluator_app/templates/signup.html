<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - AI Evaluator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <main class="auth-page">
        <section class="auth-card" aria-labelledby="signupTitle">
            <div class="auth-logo" aria-hidden="true">AI</div>
            <h1 class="auth-title" id="signupTitle">Create account</h1>
            <p class="auth-subtitle">Save evaluation history and download reports whenever you need them.</p>

            <div id="signupMessage" class="alert-custom" role="alert" aria-live="polite"></div>

            <form method="POST" class="auth-form" data-auth-form>
                <div>
                    <label for="email" class="auth-label">Email address</label>
                    <input type="email" id="email" name="email" class="auth-input" placeholder="you@example.com" autocomplete="email" required>
                </div>

                <div>
                    <label for="password" class="auth-label">Password</label>
                    <div class="input-wrap">
                        <input type="password" id="password" name="password" class="auth-input" placeholder="Create a password" autocomplete="new-password" minlength="8" required>
                        <button type="button" class="input-action" data-toggle-password="#password" aria-label="Show password">Show</button>
                    </div>
                    <div class="password-checklist" aria-live="polite">
                        <span data-password-check="length" data-label="8+ characters">○ 8+ characters</span>
                        <span data-password-check="number" data-label="Contains a number">○ Contains a number</span>
                        <span data-password-check="match" data-label="Passwords match">○ Passwords match</span>
                    </div>
                </div>

                <div>
                    <label for="confirmPassword" class="auth-label">Confirm password</label>
                    <div class="input-wrap">
                        <input type="password" id="confirmPassword" class="auth-input" placeholder="Repeat your password" autocomplete="new-password" required>
                        <button type="button" class="input-action" data-toggle-password="#confirmPassword" aria-label="Show confirm password">Show</button>
                    </div>
                </div>

                <button type="submit" class="btn-primary-custom" data-loading-text="Creating account...">Sign Up</button>
            </form>

            <div class="auth-bottom">
                Already have an account? <a href="/login">Login</a>
            </div>
            <a href="/" class="home-link">Back to Home</a>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
